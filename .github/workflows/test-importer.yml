name: Importador CNPJ - testes offline
on:
  push:
    paths:
      - 'scripts/import_cnpj.py'
      - 'tests/test_importer.py'
      - '.github/workflows/test-importer.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify syntax and run offline fixture
        run: |
          python -m py_compile scripts/import_cnpj.py
          python -m unittest discover -s tests -v
